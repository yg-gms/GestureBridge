<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GestureBridge</title>
  </head>
  <body>
    <h1>GestureBridge</h1>
    <p>Teach your webcam gestures to control a presentation.</p>

    <video id="camera-preview" autoplay muted playsinline width="640"></video>
    <button id="start-camera" type="button">Start camera</button>
    <button id="stop-camera" type="button" disabled>Stop camera</button>
    <p id="status" role="status">Camera is off.</p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
