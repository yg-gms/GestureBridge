<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GestureBridge</title>
  </head>
  <body>
    <h1>GestureBridge</h1>
    <p>Teach your webcam gestures to control a presentation.</p>

    <div style="position: relative; width: 640px; max-width: 100%;">
        <video id="camera-preview" autoplay muted playsinline
            style="display: block; width: 100%;"></video>
        <canvas id="hand-overlay" aria-hidden="true"
            style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
    </div>
    <button id="start-camera" type="button">Start camera</button>
    <button id="stop-camera" type="button" disabled>Stop camera</button>
    <p id="status" role="status">Camera is off.</p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
